  dual_color_tool: Alt+4
  mask_generator_tool: Alt+5
  traffic_light_tool: Alt+6
  rectangle_scale_tool: Alt+7
  page_text_tool: Alt+8
  label_sync_tool: null
  containment_detection_tool: Ctrl+Alt+B
  color_extract_tool: null
  highlight_settings_tool: Alt+9
  path_selection_settings_tool: Ctrl+Alt+P
  label_manager: Alt+0
  label_toggle_shortcut_manager: Ctrl+Alt+T
  color_manager_tool: Ctrl+Alt+C
  smart_guides_tool: Ctrl+Alt+G
  shortcut_manager_tool: Ctrl+Alt+K
  wheel_settings_tool: Ctrl+Alt+W
  toggle_ghost_paste: B
  toggle_continuous_drawing: L

# Auto labeling
custom_models: []

# Digit shortcuts
digit_shortcuts: null

# Smart guides (辅助线)
smart_guides_enabled: true  # 是否显示辅助线
smart_guides_enable_snap: true  # 是否启用辅助线吸附功能（可以只显示辅助线不吸附）
smart_guides_show_horizontal: true  # 是否显示水平辅助线
smart_guides_show_vertical: true  # 是否显示垂直辅助线
smart_guides_line_width: 2.0
smart_guides_line_color: [255, 0, 255]
smart_guides_opacity: 0.8
smart_guides_display_distance: 100  # 辅助线显示距离（像素）- 在此距离内才检测和显示辅助线
smart_guides_snap_distance: 10  # 吸附距离（像素）- 磁铁效果，在此距离内才自动吸附
smart_guides_max_lines: 10  # 最大辅助线条数 - 只显示最近的N条
# 辅助线方向吸附开关（可以独立控制每个方向的吸附，只有4条边）
smart_guides_snap_left: true  # 是否启用左边对齐吸附
smart_guides_snap_right: true  # 是否启用右边对齐吸附
smart_guides_snap_top: true  # 是否启用上边对齐吸附
smart_guides_snap_bottom: true  # 是否启用下边对齐吸附
# 粘贴模式辅助线
smart_guides_paste_preview_enabled: true
smart_guides_paste_show_guides: true  # 粘贴模式下是否显示辅助线
smart_guides_paste_enable_snap: true  # 粘贴模式下是否启用吸附功能
smart_guides_paste_snap_distance: 10  # 粘贴模式下的吸附距离（像素）
# 粘贴模式方向吸附开关（可以独立控制每个方向的吸附，只有4条边）
smart_guides_paste_snap_left: true  # 粘贴模式：是否启用左边对齐吸附
smart_guides_paste_snap_right: true  # 粘贴模式：是否启用右边对齐吸附
smart_guides_paste_snap_top: true  # 粘贴模式：是否启用上边对齐吸附
smart_guides_paste_snap_bottom: true  # 粘贴模式：是否启用下边对齐吸附

# Rectangle spacing guide (矩形间距线)
spacing_guide_enabled: true
spacing_guide_line_width: 2.0
spacing_guide_line_color: [0, 255, 255]  # 青色
spacing_guide_text_bg_color: [0, 0, 0, 150]  # 文字背景色（RGBA）
spacing_guide_opacity: 0.8
spacing_guide_display_distance: 500  # 间距线显示距离（像素）
spacing_guide_snap_distance: 10  # 间距线吸附距离（像素）
spacing_guide_max_shapes: 0  # 最多检测的矩形数量（0表示检测所有）

# Paste preview (虚影)
paste_preview_line_width: 2.0
paste_preview_line_color: [255, 0, 255]
paste_preview_opacity: 0.4
paste_preview_fill_opacity: 0.3

# Overlap display (重叠区域显示)
show_overlap: true  # 是否显示重叠区域颜色

# Highlight settings
highlight_positive: ""
highlight_negative: ""
highlight_mixed_mode: false
highlight_enabled_by_default: true
locked_labels: ""
pin_labels: ""
no_highlight_labels: ""
