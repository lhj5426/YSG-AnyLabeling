language: en_US
model_hub: github  # github, modelscope
auto_save: true
display_label_popup: true
store_data: false
keep_prev: false
keep_prev_scale: false
keep_prev_brightness: false
keep_prev_contrast: false
auto_use_last_label: true
continuous_drawing: false  # 连续标注模式：完成一个标注后自动保持当前绘制工具
auto_highlight_shape: true
auto_switch_to_edit_mode: true
show_groups: false
show_texts: true
show_translations: false
show_labels: true
show_scores: true
show_degrees: false
show_shapes: true
show_linking: true
show_attributes: true
show_order: true
logger_level: info
system_clipboard: false
switch_to_checked: false

flags: null
label_flags: null
labels: null
file_search: null
sort_labels: true
validate_label: null

default_shape_color: [0, 255, 0]
shape_color: auto  # null, 'auto', 'manual'
shift_auto_shape_color: 0
label_colors: null
label_border_colors: null  # 标签独立边框颜色设置，格式: {label: [r, g, b]}
label_border_widths: null  # 标签独立边框粗细设置，格式: {label: width}
label_alphas: null  # 标签独立透明度设置，格式: {label: [alpha_idle, alpha_highlight]}
label_default_border_colors: null  # 标签状态1(默认态:无点击/无高亮)独立边框颜色，格式: {label: [r, g, b]}，未设置时等于填充色
label_default_border_widths: null  # 标签状态1(默认态)独立边框宽度，格式: {label: width}，未设置时用 shape.line_width

manually_edited_color: '#0000FF'  # Blue - 手动编辑颜色

traffic_light_colors:
  selected: [255, 0, 0] # Red
  edited: [0, 255, 0] # Green
  locked: [255, 255, 0] # Yellow
  unlocked: [0, 0, 255] # Blue

shape:
  # drawing
  line_color: [0, 255, 0, 128]
  fill_color: [220, 220, 220, 150]
  vertex_fill_color: [0, 255, 0, 255]
  # selecting / hovering
  select_line_color: [255, 255, 255, 255] # For "Highlight All"
  canvas_select_line_color: [255, 0, 0, 255]
  canvas_hover_line_color: [0, 255, 255, 255]
  # Optional widths (pixels). If null/omitted, fallback to line_width
  select_line_width: null
  canvas_select_line_width: null
  canvas_hover_line_width: null
  navigator_select_line_color: [255, 0, 255, 255]
  navigator_hover_line_color: [255, 255, 0, 255]
  navigator_viewport_color: [255, 0, 0, 255]
  navigator_viewport_width: 2.0
  navigator_viewport_cross: false
  navigator_mouse_indicator_color: [255, 0, 0, 255]
  navigator_mouse_indicator_size: 4
  navigator_mouse_indicator_enabled: true
  select_fill_color: [0, 255, 0, 155]
  shape_fill_alpha_idle: 50
  shape_fill_alpha_highlight: 180
  hvertex_fill_color: [255, 255, 255, 255]
  # overlap visualization
  overlap_color: [255, 165, 0, 120]
  # alignment tool
  alignment_reference_color: [255, 0, 255, 255]  # Magenta for reference shape
  alignment_target_color: [255, 165, 0, 255]     # Orange for target shapes
  alignment_reference_line_width: 4.0
  alignment_target_line_width: 2.0
  point_size: 10  # 控制多边形等形状的圆形控制点大小
  square_size: 10  # 控制矩形的方形控制块大小
  line_width: 4

# main
flag_dock:
  show: true
  closable: true
  movable: true
  floatable: true
label_dock:
  show: true
  closable: true
  movable: true
  floatable: true
shape_dock:
  show: true
  closable: true
  movable: true
  floatable: true
file_dock:
  show: true
  closable: true
  movable: true
  floatable: true
tools_dock:
  show: true
  closable: false
  movable: true
  floatable: true
shape_text_dock:
  show: true
  closable: true
  movable: true
  floatable: true
thumbnail_dock:
  show: false
  closable: true
  movable: true
  floatable: true
attributes_dock:
  show: true
  closable: true
  movable: true
  floatable: true

# UI dock state (Base64 encoded, auto-saved)
ui:
  dock_state: ""

# navigator
navigator:
  visible: false
  position_x: 100
  position_y: 100
  width: 220
  height: 280

# label_dialog
show_label_text_field: true
label_completion: startswith
move_mode: auto  # 'auto', 'center'
fit_to_content:
  column: true
  row: false

# canvas
epsilon: 10.0
canvas:
  # None: do nothing
  # close: close polygon
  double_click: close
  # change mode
  # The max number of edits we can undo
  num_backups: 10
  wheel_rectangle_editing:
    # Edge adjustment (mouse outside rectangle)
    adjust_step_h: 1.0          # Normal scroll - horizontal edge
    adjust_step_v: 1.0          # Normal scroll - vertical edge
    shift_adjust_step_h: 5.0    # Shift+scroll - horizontal edge
    shift_adjust_step_v: 5.0    # Shift+scroll - vertical edge
    fast_adjust_step_h: 10.0    # Ctrl+scroll - horizontal edge
    fast_adjust_step_v: 10.0    # Ctrl+scroll - vertical edge
    # Inner scale (mouse inside rectangle)
    scale_step_h: 3.0           # Normal scroll - expand width
    scale_step_v: 3.0           # Ctrl+scroll - expand height
  crosshair:
    show: true
    style: dash  # "dash" or "solid"
    width: 2.0
    color: "#00FF00"
    opacity: 0.5
  zoom_at_mouse_percentage_increase: 20
  zoom_at_mouse_shortcut: Ctrl+B
  brush:
    point_distance: 25.0  # minimum screen pixel distance between auto-added points
    simplify_epsilon: 2.0  # contour simplification tolerance in image pixels
    max_undo_steps: 30  # maximum number of brush undo snapshots
    max_undo_memory_mb: 128  # memory cap for brush undo snapshots
    brush_cursor_color: [0, 255, 255, 255]  # RGBA - 画笔圈颜色
    eraser_cursor_color: [255, 100, 100, 255]  # RGBA - 橡皮擦圈颜色
    brush_cursor_shape: circle  # 光标形状: circle 或 square
    brush_radius: 12  # 画笔/橡皮擦大小 (1-200px)
    brush_invert: false  # 反转模式：默认画笔，勾选后默认橡皮擦
  mask:
    opacity: 80  # transparency value (0-255) for brush-edit mask overlay
  magic_wand:
    default_threshold: 15  # 起始色差容差 (0-255)
    drag_sensitivity: 3.0  # 每增加 1 容差所需的拖动屏幕像素
    luminance_weight: 0.5  # Lab 亮度通道权重 (0=只比颜色, 1=完全计入亮度)
    simplify_epsilon: 0.5  # 轮廓简化容差 (图像像素)
    opacity: 0.6  # 实时选区预览的填充透明度 (0-1)

